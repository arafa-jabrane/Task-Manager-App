<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <div>
            <p class="eyebrow">Task manager</p>
            <h1>Board</h1>
        </div>
        <button id="dark-mode-toggle" class="icon-button" type="button">🌙</button>
    </header>

    <main class="app-shell">
        <section class="panel panel-form">
            <div class="panel-header">
                <h2>Create new task</h2>
                <p>Keep your workflow organized with simple cards.</p>
            </div>

            <form id="task-form" class="task-form">
                <label>
                    Title <span class="required">*</span>
                    <input type="text" id="task-title" placeholder="Task title" required>
                </label>

                <label>
                    Description
                    <textarea id="task-description" placeholder="Optional description"></textarea>
                </label>

                <div class="field-group">
                    <label>
                        Priority
                        <select id="task-priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </label>
                    <label>
                        Due date
                        <input type="date" id="task-due-date">
                    </label>
                </div>

                <button type="submit" class="primary-button">Add task</button>
            </form>

            <div class="panel-filters">
                <h2>Filters</h2>
                <div class="filter-row">
                    <label>
                        Status
                        <select id="status-filter">
                            <option value="all">All statuses</option>
                            <option value="todo">To Do</option>
                            <option value="doing">Doing</option>
                            <option value="done">Done</option>
                        </select>
                    </label>
                    <label>
                        Priority
                        <select id="priority-filter">
                            <option value="all">All priorities</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </label>
                </div>
            </div>
        </section>

        <section id="board" class="board">
            <div class="column" data-status="todo">
                <div class="column-header">
                    <h2>To Do</h2>
                    <span class="column-count" id="todo-count">0</span>
                </div>
                <div class="task-list" id="todo-list"></div>
            </div>

            <div class="column" data-status="doing">
                <div class="column-header">
                    <h2>Doing</h2>
                    <span class="column-count" id="doing-count">0</span>
                </div>
                <div class="task-list" id="doing-list"></div>
            </div>

            <div class="column" data-status="done">
                <div class="column-header">
                    <h2>Done</h2>
                    <span class="column-count" id="done-count">0</span>
                </div>
                <div class="task-list" id="done-list"></div>
            </div>
        </section>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
